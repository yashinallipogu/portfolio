<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume — Yashi Nallipogu</title>
  <script>try { const t = localStorage.getItem('portfolio-neutral-theme'); if(t==='dark'||t==='light') document.documentElement.dataset.theme=t; } catch {}</script>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .resume-main { padding: 40px 0; }
    .resume-heading { display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; margin-bottom:24px; }
    .resume-heading h1 { font-size:48px; margin:0; }
    .resume-heading p { color:var(--muted); }
    .resume-actions { display:flex; gap:12px; flex-wrap:wrap; }
    .resume-actions a { padding:12px 16px; border:1px solid var(--line); box-shadow:3px 3px 0 var(--line); }
    .resume-document { background:#eee; padding:20px; border:1px solid var(--line); }
    .resume-document iframe { display:block; width:100%; height:80vh; min-height:500px; border:0; background:#fff; }
    .resume-empty { padding:72px 24px; text-align:center; background:var(--paper); color:var(--ink); }
    .resume-empty p { max-width:520px; margin:18px auto; line-height:1.7; }
    [hidden] { display:none !important; }
    @media(max-width:680px) { .resume-document { padding:6px; } .resume-heading h1 {font-size:36px;} }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><nav class="nav page-wrap" aria-label="Resume navigation">

    <a href="index.html#work">Projects</a>
    <a href="index.html#contact">Contact</a>
  </nav></header>
  <main id="main" class="resume-main page-wrap">
    <div class="resume-heading"><div><h1>Resume</h1><p>Yashi Nallipogu</p></div>
      <div class="resume-actions" id="resume-actions">
        <a href="https://docs.google.com/document/d/1Mzih0dF0hDZXyxszmKcfLNMdFsdRte3yyIfAd0Ch5eY/export?format=pdf" target="_blank" rel="noopener">Download PDF ↓</a>
        <a href="https://docs.google.com/document/d/1Mzih0dF0hDZXyxszmKcfLNMdFsdRte3yyIfAd0Ch5eY/preview" target="_blank" rel="noopener">Open document ↗</a>
      </div>
    </div>
    <section class="resume-document" aria-label="Resume document viewer"><iframe src="https://docs.google.com/document/d/1Mzih0dF0hDZXyxszmKcfLNMdFsdRte3yyIfAd0Ch5eY/preview" title="Yashi Nallipogu resume — Google Docs read-only preview"></iframe></section><p style="color:var(--muted);line-height:1.6">This viewer displays the current Google Doc. If it does not load, use Open document above.</p>
  </main>
